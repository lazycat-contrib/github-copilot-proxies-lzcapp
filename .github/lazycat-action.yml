version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/copilot.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: copilot-app
build:
  run_buildscript: false
images:
  - id: copilot-app
    target: service
    service: copilot-app
    source: registry.cn-hangzhou.aliyuncs.com/ripper/copilot-proxies
    channel: stable
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Copilot后端代理
    summary: "GitHub Copilot插件服务端"
